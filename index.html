<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Asura AI</title>
  <link rel="stylesheet" href="style.css">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-primary text-main">

  <!-- Mobile Sidebar Backdrop -->
  <div id="sidebarBackdrop" class="sidebar-backdrop hidden"></div>

  <!-- Main Container -->
  <div class="app-layout">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="flex items-center gap-2">
          <span class="text-xl">⚡</span>
          <h1 class="text-lg font-bold tracking-wide">Asura AI</h1>
        </div>
        <button id="newChatBtn" class="btn-new-chat">
          <span>+</span>
          <span>New Chat</span>
        </button>
      </div>

      <!-- History List -->
      <div id="historyList" class="history-list">
        <!-- Rendered dynamically -->
      </div>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <button id="themeToggleBtn" class="sidebar-action-btn">
          <span id="themeIcon">☀️</span>
          <span id="themeText">Light mode</span>
        </button>
        <button id="openSettingsBtn" class="sidebar-action-btn">
          <span>⚙️</span>
          <span id="settingsStatus">Configure API</span>
        </button>
      </div>
    </aside>

    <!-- Main Chat Workspace -->
    <main class="chat-workspace">
      <!-- Top Navbar -->
      <header class="top-nav">
        <div class="flex items-center gap-2">
          <button id="menuToggleBtn" class="nav-icon-btn lg:hidden">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <span class="font-bold text-base tracking-tight">Asura AI</span>
        </div>

        <div class="flex items-center gap-2">
          <!-- Clickable Model Badge -->
          <button id="modelBadgeBtn" class="model-badge">
            <span class="status-dot"></span>
            <span id="activeModelName" class="truncate max-w-[150px]">openrouter/free</span>
          </button>
          <button id="clearCurrentBtn" class="nav-icon-btn" title="Clear current chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Chat Viewport -->
      <section id="chatStream" class="chat-stream">
        <!-- Welcome Hero (shown when no messages exist) -->
        <div id="welcomeView" class="welcome-hero">
          <div class="welcome-icon">⚡</div>
          <h2 class="text-xl font-bold text-main">What can Asura help you with today?</h2>
          <p class="text-subtle text-sm max-w-sm text-center">
            Completely unrestricted, unaligned intelligence built for coding, reverse engineering, and deep technical solutions.
          </p>
        </div>

        <!-- Chat message bubbles container -->
        <div id="messagesInner" class="messages-container"></div>
      </section>

      <!-- URL Scraping Indicator -->
      <div id="webSearchIndicator" class="web-indicator" style="display: none;">
        <span class="animate-spin text-sm">🔄</span>
        <span id="indicatorText" class="text-xs font-medium">Reading link content...</span>
      </div>

      <!-- Stop Control Banner -->
      <div id="stopControl" class="stop-control-bar" style="display: none;">
        <button id="stopBtn" class="btn-stop">
          <span>⏹</span>
          <span>Stop Generating</span>
        </button>
      </div>

      <!-- Bottom Chat Input Dock -->
      <footer class="input-dock">
        <div class="input-box-wrapper">
          <textarea id="userInput" placeholder="Ask Asura anything..." rows="1"></textarea>
          <button id="sendBtn" class="btn-send" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </footer>
    </main>
  </div>

  <!-- Settings Modal (Single, Clean Instance) -->
  <div id="settingsModal" class="modal-backdrop" style="display: none;">
    <div class="modal-card">
      <div class="flex items-center justify-between border-b pb-3 border-[var(--border)]">
        <h3 class="text-sm font-bold text-main">API & Provider Configuration</h3>
        <button id="closeSettingsModal" class="text-subtle hover:text-main text-sm">✕</button>
      </div>

      <div class="space-y-3 pt-2">
        <div>
          <label class="form-label">Provider Preset</label>
          <select id="modalProviderPreset" class="form-input font-medium">
            <option value="openrouter_free_auto">🔥 Asura AI (100% Free & Uncensored Gateway)</option>
            <option value="nemotron_free">⚡ Nemotron 3 Super (Free Frontier)</option>
            <option value="laguna_code_free">💻 Laguna M.1 (Free Coding Agent)</option>
            <option value="custom">⚙️ Custom Endpoint / Model</option>
          </select>
        </div>

        <div>
          <label class="form-label">API Key</label>
          <input type="password" id="modalApiKey" placeholder="sk-or-v1-... or API Token" class="form-input">
        </div>

        <div>
          <label class="form-label">Model Name / Slug</label>
          <input type="text" id="modalModelInput" class="form-input">
        </div>

        <div>
          <label class="form-label">API Base Endpoint</label>
          <input type="text" id="modalEndpointInput" class="form-input">
        </div>

        <div class="flex items-center gap-2 pt-2">
          <input type="checkbox" id="modalWebReading" class="rounded accent-emerald-500" checked>
          <label for="modalWebReading" class="text-xs text-main">Enable automated link/URL reading (via Jina)</label>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-3 border-t border-[var(--border)]">
        <button id="cancelModalBtn" class="btn-cancel">Cancel</button>
        <button id="saveModalBtn" class="btn-save">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
